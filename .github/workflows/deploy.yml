name: Deployment
on:
  push:
    branches:
      - main
      - dev
  
env:
  MONGODB_DB_NAME: gha-demo1
jobs:
  test:
    environment: testing
    env:
      MONGODB_CLUSTER_ADDRESS: samplecluster.npslotd.mongodb.net
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      PORT: 3000
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        working-directory: ./01 Starting Project
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT
        working-directory: ./01 Starting Project
      - name: Run tests
        run: npm test
        working-directory: ./01 Starting Project
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{env.MONGODB_USERNAME}}"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          echo "MONGODB_CLUSTER_ADDRESS: ${{env.MONGODB_CLUSTER_ADDRESS}}"
          echo "MONGODB_USERNAME: ${{env.MONGODB_USERNAME}}"
          echo "MONGODB_PASSWORD: ${{env.MONGODB_PASSWORD}}"
          echo "PORT: ${{env.PORT}}"